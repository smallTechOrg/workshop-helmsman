# Workshop0 — local-dev compose: the app only, SQLite in a named volume.
# (Production is Cloud Run; see deploy/RUNBOOK.md.)
#
# Usage, from the repo root:
#   cp .env.example .env      # set WORKSHOP0_ADMIN_KEY
#   docker compose -f deploy/docker-compose.yml up --build
# then open http://localhost:8001/

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: workshop0:latest
    restart: unless-stopped
    # Secrets/config (WORKSHOP0_ADMIN_KEY, OPENROUTER_API_KEY, optional
    # WORKSHOP0_BASE_URL ...) come from the repo-root .env.
    env_file:
      - path: ../.env
        required: false
    environment:
      PORT: "8001"
      DATABASE_URL: "sqlite:///data/workshop0.db"
      WORKSHOP0_MIGRATE_ON_BOOT: "1"
    volumes:
      - workshop0-data:/srv/workshop0/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8001/api/health').status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "8001:8001"

volumes:
  workshop0-data:
